[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shared-ledger"
version = "0.1.0"
description = "多人共享记账系统：实验三项目骨架"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=12.3,<14",
    "pwdlib[argon2]>=0.3,<1",
    "pyside6-essentials>=6.8,<7",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ledger-server = "app.api.__main__:main"
ledger-desktop = "app.ui.__main__:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "httpx2",
    "pylint>=3.3,<5",
    "pytest>=8,<10",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/tests", "/scripts", "/README.md", "/Makefile", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 12

[tool.pylint.messages_control]
disable = ["too-few-public-methods"]
